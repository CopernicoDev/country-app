<app-search placeholder="Busque su capital" (value)="query.set($event)" />

@if (countryResource.isLoading()) {
  <h3>Cargando...</h3>
} @else if (countryResource.error()) {
  <h3 class="mt-10 text-red-700">{{countryResource.error()}}</h3>
} @else {
  <app-country-list [countries]="countryResource.value() || []" />
}

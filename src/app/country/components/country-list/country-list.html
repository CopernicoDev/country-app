<section class="mt-10">
    <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
        <table class="table">
            <!-- head -->
            <thead>
                <tr>
                    <th>#</th>
                    <th>Ícono</th>
                    <th>Bandera</th>
                    <th>Nombre</th>
                    <th>Capital</th>
                    <th>Población</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                @for (country of countries(); track country.cca2; let i = $index) {
                <tr>
                    <td>{{ i + 1 }}</td>
                    <!-- Columna de Ícono (emoji) -->
                    <td>{{ country.flag }}</td>

                    <!-- Columna de Bandera (imagen) -->
                    <td>
                        <img [src]="country.flagSvg" [alt]="country.name" class="w-10 border border-base-content/10">
                    </td>

                    <td>{{ country.name }}</td>
                    <td>{{ country.capital }}</td>
                    <td>{{ country.population }}</td>

                    <td>
                        <a class="link-primary cursor-pointer">Más información</a>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</section>
